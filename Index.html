<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SanaveraYou Pro</title>

  <meta name="theme-color" content="#0b0a11" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <img
    id="logoFloat"
    class="logo-float"
    src="logo78.png"
    alt="Logo"
  />

  <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">
    <span class="ico sun" aria-hidden="true"></span>
    <span class="ico moon" aria-hidden="true"></span>
  </button>

  <button id="userMenuBtn" class="search-fab user-menu-btn" aria-label="Menú de usuario">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.93 0 3.5 1.57 3.5 3.5S13.93 12 12 12 8.5 10.43 8.5 8.5 10.07 5 12 5zm0 14.2c-2.82 0-5.63-1.07-8-3.11-.08-.07-.15-.15-.22-.24-.48-.68-.84-1.4-1.06-2.17.48-.11.97-.24 1.48-.36.96-.24 1.95-.39 2.97-.47 1.05-.08 2.11-.1 3.19-.06 1.08.04 2.14.12 3.2.2 1.02.08 2.02.23 3 .47.51.12 1 .25 1.48.36-.22.77-.58 1.49-1.06 2.17-.07.09-.14.17-.22.24-2.37 2.04-5.18 3.11-8 3.11z"/></svg>
  </button>

  <button id="searchFab" class="search-fab search-fab-global" aria-label="Buscar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M15.5 14h-.79l-.28-.27A6.48 6.48 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.27v.8L20 21.5 21.5 20l-6-6zM9.5 14A4.5 4.5 0 1114 9.5 4.51 4.51 0 019.5 14z"/>
    </svg>
  </button>

  <div id="userMenu" class="minimodal-overlay hide">
    <div class="minimodal-container">
      <div id="minimodalContent"></div>
    </div>
  </div>

  <div id="searchOverlay" class="search-overlay">
    <div class="search-card">
      <input id="overlaySearchInput" placeholder="Buscar canciones..." autocomplete="off" />
      <div id="searchTypeSwitch" class="search-type-switch">
          <button class="switch-btn active" data-type="youtube">Canciones</button>
          <button class="switch-btn" data-type="archive">Álbumes</button>
      </div>
    </div>
  </div>

  <main id="views">
    <!-- … (todo tu contenido del <main> queda igual) … -->
  </main>

  <!-- Scripts -->
  <script type="module" src="utils.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="reproductor.js"></script>
  <script type="module" src="buscador.js"></script>
  <script type="module" src="playlists.js"></script>
  <script type="module" src="favoritos.js"></script>
  <script type="module" src="main.js"></script>

</body>
</html>
